<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eczema app · interactive prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF8F7}
a{color:#2F3C9E}a:hover{color:#232E7E}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid #8C96E3;outline-offset:2px}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.glow{position:absolute;left:0;right:0;top:0;height:300px;pointer-events:none;background:radial-gradient(60% 55% at 8% 0%,#E3E2F8 0%,rgba(227,226,248,0) 70%),radial-gradient(55% 50% at 95% 0%,#FCE1DC 0%,rgba(252,225,220,0) 70%)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:18px;height:18px}
.ic-lg{width:34px;height:34px;stroke-width:1.5}
.card{background:#FFFFFF;border-radius:22px;box-shadow:0 1px 2px rgba(31,35,71,.04),0 6px 20px rgba(31,35,71,.05)}
.h1{margin:0;font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-0.02em;color:#2F3C9E}
.h2{margin:0;font-size:18px;line-height:1.3;font-weight:600;color:#1F2347}
.q{margin:0;font-size:19px;line-height:1.35;font-weight:500;color:#1F2347;text-wrap:pretty}
.muted{color:#5F6380}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:transparent;display:grid;place-items:center;color:#1F2347;padding:0}
.iconbtn:hover{background:rgba(31,35,71,.05)}
.chip{min-height:38px;padding:0 15px;border-radius:999px;border:0;background:#F3F0F4;font-size:14px;font-weight:600;color:#4A4E69;transition:background .15s,color .15s;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#2F3C9E;color:#FFFFFF}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid #AEB4E2;background:#FFFFFF;display:grid;place-items:center;color:#FFFFFF;flex:none;padding:0;transition:all .18s}
.check.on{background:#2F3C9E;border-color:#2F3C9E}
.todo{display:flex;align-items:center;gap:14px;min-height:56px;width:100%;border:0;background:transparent;text-align:left;padding:6px 0;color:inherit}
.todo-t{font-size:15px;font-weight:600;color:#1F2347}
.todo.done .todo-t{color:#8A8DA3;text-decoration:line-through}
.todo-s{font-size:13px;color:#5F6380;margin-top:2px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;background:#FFFFFF;border-top:1px solid #F0EBEE;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding-top:8px;box-sizing:border-box;z-index:5}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#666980;padding:6px 0;min-height:52px}
.tab.on{color:#2F3C9E}
.fab{justify-self:center;margin-top:-30px;width:64px;height:64px;border-radius:50%;border:5px solid #FBF8F7;background:#2F3C9E;color:#FFFFFF;display:grid;place-items:center;padding:0}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#F1EEF2;border-radius:14px;padding:4px;gap:4px}
.seg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{height:40px;border:0;border-radius:11px;background:transparent;font-size:14px;font-weight:700;color:#5F6380}
.seg button.on{background:#FFFFFF;color:#1F2347;box-shadow:0 1px 3px rgba(31,35,71,.12)}
.primary{height:54px;border-radius:16px;border:0;background:#2F3C9E;color:#FFFFFF;font-weight:700;font-size:16px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.primary:hover{background:#26318A}
.primary[disabled]{background:#C9CCE6;cursor:not-allowed}
.ghost{height:54px;width:54px;border-radius:16px;border:0;background:#F1EEF2;color:#1F2347;display:grid;place-items:center;padding:0;flex:none}
.subhead{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0}
.subhead-t{font-size:16px;font-weight:600;color:#1F2347}
.optcard{border:0;background:#F5F2F6;transition:background .15s,color .15s;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#5F6380;font-size:14px;font-weight:600;padding:12px 8px}
.optcard.on{background:#E3E6F8;color:#2F3C9E;box-shadow:inset 0 0 0 2px #2F3C9E}
.hit{position:absolute;border:0;background:transparent;padding:0;border-radius:12px}
.row-link{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:14px 0 0;font-size:15px;font-weight:700;color:#2F3C9E;min-height:44px}
.bell{width:44px;height:44px;border-radius:14px;border:0;background:#FFE1DA;color:#B23A27;display:grid;place-items:center;flex:none;padding:0;transition:all .18s}
.bell.on{background:#2F3C9E;color:#FFFFFF}
.date{width:52px;height:56px;border-radius:14px;background:#EEF0FB;color:#2F3C9E;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.toast{position:absolute;left:20px;right:20px;z-index:20;background:#1F2347;color:#FFFFFF;border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(31,35,71,.3);animation:toastIn .28s ease-out}
.burst{position:absolute;inset:-10px;border-radius:50%;border:2px solid #FF7B67;animation:burst .7s ease-out forwards;pointer-events:none}
.pad{border:0;border-radius:28px;display:grid;place-items:center;color:#FFFFFF;font-size:15px;font-weight:700;transition:opacity .15s,transform .08s}
.pad:active{transform:scale(.96)}
.pad.next{animation:pulse 1.1s ease-in-out infinite}
.pad.wait{opacity:.28}
.medal{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#B4B1C2;background:#F1EEF2;font-size:22px}
.medal.got{background:radial-gradient(circle at 30% 25%,#FFFFFF 0%,#F4E9EE 45%,#E2DDF0 100%);color:#1F2347}
.medal.coral{background:#FFE1DA;color:#B23A27}
.medal.indigo{background:#E3E6F8;color:#2F3C9E}
@keyframes burst{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes toastIn{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,123,103,.0)}50%{box-shadow:0 0 0 10px rgba(47,60,158,.12)}}
@keyframes sheetIn{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
</style>

<style>
html,body{height:100%}
body{margin:0;background:#FBF8F7;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:390px;height:844px;transform-origin:center center;flex:none}
</style>
</head>
<body>
<div id="stage"><div id="app"></div></div>
<template id="tpl"><div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF8F7; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; color: #1F2347">

<!-- ================= HOME ================= -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div class="scr">
<div class="glow"></div>
<div style="position: relative; padding: 64px 20px 120px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div>
<div style="font-size: 14px; font-weight: 600; color: #5F6380">Hi Clara</div>
<h1 class="h1">{{greeting}}</h1>
</div>
<button onClick="{{goProfile}}" aria-label="Open profile" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #E3E6F8; color: #2F3C9E; display: grid; place-items: center; padding: 0; font-size: 14px; font-weight: 700">CK</button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<button onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="border: 0; border-radius: 16px; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; {{d.style}}">
<span style="font-size: 12px; font-weight: 600">{{d.d}}</span>
<span style="font-size: 20px; font-weight: 800">{{d.n}}</span>
</button>
</sc-for>
</div>
<div class="card" style="padding: 18px 20px 10px">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px">
<h2 class="h2">To-do list</h2>
<span style="font-size: 13px; font-weight: 600; color: #5F6380">{{doneCount}} of 3 done</span>
</div>
<sc-for list="{{todoItems}}" as="t" hint-placeholder-count="2">
<button class="todo {{t.cls}}" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}">
<span class="check {{t.cls}}"><sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><svg class="ic ic-sm" viewBox="0 0 24 24" style="stroke-width: 2.6"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if></span>
<span style="flex: 1"><div class="todo-t">{{t.t}}</div><div class="todo-s">{{t.s}}</div></span>
</button>
</sc-for>
<button class="todo {{logCls}}" onClick="{{logTodo}}">
<sc-if value="{{logDone}}" hint-placeholder-val="{{ false }}">
<span class="check on" style="position: relative"><svg class="ic ic-sm" viewBox="0 0 24 24" style="stroke-width: 2.6"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg><sc-if value="{{burst}}" hint-placeholder-val="{{ false }}"><span class="burst"></span></sc-if></span>
</sc-if>
<sc-if value="{{logOpen}}" hint-placeholder-val="{{ true }}">
<span style="width: 28px; height: 28px; border-radius: 50%; background: #2F3C9E; color: #FFFFFF; display: grid; place-items: center; flex: none"><svg class="ic ic-sm" viewBox="0 0 24 24" style="stroke-width: 2.4"><path d="M12 5v14M5 12h14"></path></svg></span>
</sc-if>
<span style="flex: 1"><div class="todo-t">Complete Daily Log</div><div class="todo-s">{{streakText}}</div></span>
<sc-if value="{{logOpen}}" hint-placeholder-val="{{ true }}"><svg class="ic ic-sm" viewBox="0 0 24 24" style="color: #2F3C9E"><path d="m9 6 6 6-6 6"></path></svg></sc-if>
</button>
</div>
<div class="card" style="padding: 20px; display: flex; gap: 12px; align-items: flex-start">
<div style="flex: 1">
<p style="margin: 0; font-size: 17px; line-height: 1.45; font-weight: 600; color: #1F2347; text-wrap: pretty">“Your path may be different, but you are not lost.”</p>
<div style="font-size: 13px; color: #5F6380; margin-top: 8px">Unknown</div>
</div>
<button class="iconbtn" onClick="{{toggleLike}}" aria-label="Save quote" aria-pressed="{{likedPressed}}" style="color: {{likeColor}}; margin: -10px -10px 0 0">
<svg class="ic" viewBox="0 0 24 24" style="fill: {{likeFill}}"><path d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5c-2.2 4.6-9.2 9-9.2 9z"></path></svg>
</button>
</div>
<button onClick="{{goPanic}}" style="border: 0; border-radius: 28px; background: #FFE1DA; color: #1F2347; padding: 20px 18px 20px 22px; display: flex; align-items: center; gap: 12px; text-align: left; position: relative; overflow: hidden">
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 700; color: #B23A27">Feeling itchy?</span>
<span style="font-size: 21px; font-weight: 600; letter-spacing: -0.01em">Itch Attack Panic</span>
<span style="font-size: 14px; color: #4A4E69; line-height: 1.4">A one-minute game to calm the urge to scratch</span>
<span style="align-self: flex-start; margin-top: 10px; height: 38px; border-radius: 999px; background: #FF7B67; color: #1F2347; font-size: 14px; font-weight: 700; padding: 0 16px 0 12px; display: inline-flex; align-items: center; gap: 6px"><svg class="ic ic-sm" viewBox="0 0 24 24" style="fill: currentColor; stroke-width: 1.4"><path d="M8 5.5v13l10-6.5z"></path></svg>Start</span>
</span>
<svg viewBox="0 0 110 110" style="width: 108px; height: 108px; flex: none" aria-hidden="true">
<path d="M55 14c22 0 40 15 40 39 0 23-15 43-40 43S15 78 15 55c0-24 18-41 40-41z" fill="#FF7B67"></path>
<path d="M38 52c2-4 8-4 10 0M62 52c2-4 8-4 10 0" fill="none" stroke="#1F2347" stroke-width="3" stroke-linecap="round"></path>
<ellipse cx="34" cy="63" rx="6" ry="3.5" fill="#FFC4B8"></ellipse><ellipse cx="76" cy="63" rx="6" ry="3.5" fill="#FFC4B8"></ellipse>
<path d="M49 64c3 4 9 4 12 0" fill="none" stroke="#1F2347" stroke-width="3" stroke-linecap="round"></path>
<path d="M95 16v10M90 21h10M14 86v8M10 90h8" fill="none" stroke="#2F3C9E" stroke-width="2.4" stroke-linecap="round"></path>
<circle cx="100" cy="44" r="3" fill="#2F3C9E"></circle>
</svg>
</button>
</div>
</div>
</sc-if>

<!-- ================= CALENDAR ================= -->
<sc-if value="{{isCalendar}}" hint-placeholder-val="{{ false }}">
<div class="scr">
<div class="glow"></div>
<div style="position: relative; padding: 56px 20px 120px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button class="iconbtn" onClick="{{prevMonth}}" aria-label="Previous month" style="color: #2F3C9E"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg></button>
<h1 class="h1" style="font-size: 26px">{{cal.label}}</h1>
<button class="iconbtn" onClick="{{nextMonth}}" aria-label="Next month" style="color: #2F3C9E"><svg class="ic" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"></path></svg></button>
</div>
<div class="card" style="padding: 14px 12px 16px">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 700; color: #5F6380; padding-bottom: 8px; border-bottom: 1px solid #F0ECEF; margin-bottom: 6px">
<span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px">
<sc-for list="{{cal.cells}}" as="c" hint-placeholder-count="35">
<div style="position: relative; height: 42px; display: grid; place-items: center">
<sc-if value="{{c.flare}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 4px; bottom: 4px; background: #FFD9D1; {{c.bar}}"></span></sc-if>
<button onClick="{{c.pick}}" disabled="{{c.out}}" aria-label="{{c.aria}}" style="position: relative; width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0; font-size: 15px; {{c.style}}">{{c.n}}</button>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5F6380; margin-top: 10px; padding-left: 6px">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FFD9D1"></span>Active flare days
</div>
</div>
<div class="seg seg3" role="tablist">
<button class="{{calTabs.o}}" onClick="{{calOverview}}" role="tab">Overview</button>
<button class="{{calTabs.s}}" onClick="{{calSymptoms}}" role="tab">Symptoms</button>
<button class="{{calTabs.l}}" onClick="{{calLog}}" role="tab">Daily Log</button>
</div>
<sc-if value="{{calIsOverview}}" hint-placeholder-val="{{ true }}">
<div class="card" style="padding: 18px 20px 10px">
<h2 class="h2" style="margin-bottom: 4px">To-do list · {{calDayLabel}}</h2>
<sc-for list="{{todoItems}}" as="t" hint-placeholder-count="2">
<button class="todo {{t.cls}}" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}">
<span class="check {{t.cls}}"><sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><svg class="ic ic-sm" viewBox="0 0 24 24" style="stroke-width: 2.6"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if></span>
<span style="flex: 1"><div class="todo-t">{{t.t}}</div><div class="todo-s">{{t.s}}</div></span>
<span style="font-size: 12px; font-weight: 700; color: #2F3C9E">+50</span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{calIsSymptoms}}" hint-placeholder-val="{{ false }}">
<div class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 18px">
<div>
<h2 class="h2" style="margin-bottom: 10px">Skin feel</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="chip on">Itchy</span><span class="chip on">Dry</span><span class="chip on">Inflamed</span></div>
</div>
<div style="border-top: 1px solid #F0ECEF; padding-top: 18px">
<h2 class="h2" style="margin-bottom: 10px">Affected areas</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="chip">Chest</span><span class="chip">Left upper arm</span><span class="chip">Right hand</span></div>
</div>
</div>
</sc-if>
<sc-if value="{{calIsLog}}" hint-placeholder-val="{{ false }}">
<div class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 class="h2">Daily Log · {{calDayLabel}}</h2>
<button onClick="{{startLog}}" style="border: 0; background: transparent; color: #2F3C9E; font-weight: 700; font-size: 14px; min-height: 44px; padding: 0">Edit log</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="background: #F8F6F8; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; color: #5F6380">Emotions</span>
<span style="display: flex; align-items: center; gap: 8px; font-weight: 700; color: #2F3C9E"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5v.5M15 9.5v.5"></path></svg>Good</span>
</div>
<div style="background: #F8F6F8; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; color: #5F6380">Sleep</span>
<span style="display: flex; align-items: center; gap: 8px; font-weight: 700; color: #2F3C9E"><svg class="ic" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>7+ hours</span>
</div>
</div>
<div>
<span style="font-size: 12px; font-weight: 700; color: #5F6380">Treatments</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px"><span class="chip">Cortisone cream</span><span class="chip">Moisturizer</span></div>
</div>
<div>
<span style="font-size: 12px; font-weight: 700; color: #5F6380">Skin feel</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px"><span class="chip on">Itchy</span><span class="chip on">Dry</span><span class="chip on">Inflamed</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #F0ECEF; padding-top: 16px">
<div><div style="font-size: 30px; font-weight: 800">3</div><div style="font-size: 13px; color: #5F6380">active flare-ups</div></div>
<div style="border-left: 1px solid #F0ECEF; padding-left: 16px"><div style="font-size: 30px; font-weight: 800">2</div><div style="font-size: 13px; color: #5F6380">chronic</div></div>
</div>
<div style="border-top: 1px solid #F0ECEF; padding-top: 16px">
<span style="font-size: 12px; font-weight: 700; color: #5F6380">Skin score</span>
<div style="display: flex; align-items: baseline; gap: 10px"><span style="font-size: 34px; font-weight: 800">41</span><span style="font-size: 13px; font-weight: 700; color: #1F7A52">↑ 10 points since yesterday</span></div>
</div>
</div>
</sc-if>
</div>
</div>
</sc-if>

<!-- ================= TIPS ================= -->
<sc-if value="{{isTips}}" hint-placeholder-val="{{ false }}">
<div class="scr">
<div class="glow"></div>
<div style="position: relative; padding: 64px 20px 120px; display: flex; flex-direction: column; gap: 14px">
<h1 class="h1">Tips</h1>
<h2 class="h2" style="margin-top: 10px">Tips for today</h2>
<sc-for list="{{todoItems}}" as="t" hint-placeholder-count="2">
<button class="card todo {{t.cls}}" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="padding: 14px 18px; background: #FFFFFF">
<span class="check {{t.cls}}"><sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><svg class="ic ic-sm" viewBox="0 0 24 24" style="stroke-width: 2.6"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if></span>
<span style="flex: 1"><div class="todo-t">{{t.t}}</div><div class="todo-s">{{t.s}}</div></span>
<span style="font-size: 12px; font-weight: 700; color: #2F3C9E; background: #EEF0FB; border-radius: 999px; padding: 4px 9px">+50</span>
</button>
</sc-for>
<h2 class="h2" style="margin-top: 14px">Trigger warnings</h2>
<sc-for list="{{warnings}}" as="w" hint-placeholder-count="3">
<div class="card" style="padding: 14px; display: flex; align-items: center; gap: 14px">

  setLog(p) { this.setState({ log: Object.assign({}, this.state.log, p) }); }

        style: 'left:' + p.x + 'px;top:' + p.y + 'px;width:' + p.w + 'px;height:' + p.h + 'px' };
    });

  }
  heat(map) {
    var fill = {};

  }
  treatList(sel, onToggle) {
    return TREAT.map(function (t) {
      var on = sel.indexOf(t.id) >= 0;
      return { label: t.label, cls: on ? 'on' : '', pressed: on ? 'true' : 'false', isPill: t.k === 'pill', isJar: t.k === 'jar', isTube: t.k === 'tube', isLeaf: t.k === 'leaf', toggle: function () { onToggle(t.id); } };
    });
  }
  calendar() {
    var self = this, s = this.state;
    var base = new Date(2022, s.calOffset, 1), y = base.getFullYear(), m = base.getMonth();
    var first = (base.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate(), prevDays = new Date(y, m, 0).getDate();
    var flares = (y === 2022 && m === 0) ? [3, 4, 5, 6, 11, 20, 23, 24] : [];
    var total = Math.ceil((first + days) / 7) * 7, cells = [];
    for (var i = 0; i < total; i++) {
      var n = i - first + 1, out = n < 1 || n > days, num = out ? (n < 1 ? prevDays + n : n - days) : n;
      var col = i % 7, isF = !out && flares.indexOf(n) >= 0;
      var pv = isF && col > 0 && flares.indexOf(n - 1) >= 0, nx = isF && col < 6 && flares.indexOf(n + 1) >= 0 && n + 1 <= days;
      var sel = !out && n === s.calSel;
      var style = out ? 'background:transparent;color:#C3C0CE;cursor:default' : (sel ? 'background:#FF7B67;color:#1F2347;font-weight:700' : 'background:transparent;color:#1F2347;font-weight:' + (isF ? '700' : '500'));
      var bar = 'left:' + (pv ? 0 : 3) + 'px;right:' + (nx ? 0 : 3) + 'px;border-radius:' + (pv ? 0 : 17) + 'px ' + (nx ? 0 : 17) + 'px ' + (nx ? 0 : 17) + 'px ' + (pv ? 0 : 17) + 'px';
      (function (day) {
        cells.push({ n: num, out: out, flare: isF, bar: bar, style: style, aria: out ? '' : (base.toLocaleString('en-US', { month: 'long' }) + ' ' + day + (isF ? ', flare day' : '')), pick: function () { if (day >= 1 && day <= days) self.setState({ calSel: day }); } });
      })(n);
    }
    return { label: base.toLocaleString('en-US', { month: 'long' }) + ' ' + y, cells: cells, short: base.toLocaleString('en-US', { month: 'short' }) };
  }
  renderVals() {
    var self = this, s = this.state, scr = s.screen;
    var hr = new Date().getHours();
    var greeting = hr < 12 ? 'Good morning' : (hr < 18 ? 'Good afternoon' : 'Good evening');
    var weekD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    var week = weekD.map(function (d, i) {
      var on = i === s.day;
      return { d: d, n: 6 + i, pressed: on ? 'true' : 'false', pick: function () { self.setState({ day: i }); }, style: on ? 'background:#2F3C9E;color:#FFFFFF' : 'background:transparent;color:#55598F' };
    });

    var todoItems = TD.map(function (x, i) { var on = s.todos[i]; return { t: x.t, s: x.s, on: on, cls: on ? 'on done' : '', pressed: on ? 'true' : 'false', toggle: function () { self.toggleTodo(i); } }; });

    var cal = this.calendar();

    };
    var W = [
      { id: 'w1', m: 'JAN', d: '23', t: 'Low humidity', s: 'Remember to take antihistamines' },
      { id: 'w2', m: 'JAN', d: '24', t: 'Upcoming test', s: 'Watch your stress levels to prevent a flare-up' },
      { id: 'w3', m: 'JAN', d: '30', t: 'Period expected', s: 'Drink more water and moisturize more often' }
    ];
    var warnings = W.map(function (w) { return Object.assign({}, w, bellify(w.id, w.t)); });
    var forecastTabs = ['stressed', 'itchy', 'tired'].map(function (k) {
      var on = s.forecast === k;
      return { label: FORECAST[k].label, cls: on ? 'on' : '', pressed: on ? 'true' : 'false', isStressed: k === 'stressed', isItchy: k === 'itchy', isTired: k === 'tired', pick: function () { self.setState({ forecast: k }); } };
    });
    var F = FORECAST[s.forecast], ans = s.answers[s.forecast];
    var fc = {
      lower: F.label.toLowerCase(), how: F.how, yesCls: ans === 'yes' ? 'on' : '', noCls: ans === 'no' ? 'on' : '',
      remember: F.remember.map(function (r) { return Object.assign({ t: r.t, isJar: r.k === 'jar', isAlert: r.k === 'alert', isWind: r.k === 'wind', isMoon: r.k === 'moon' }, bellify(r.id, r.t)); })
    };
    var answer = function (v) { var a = Object.assign({}, s.answers); a[s.forecast] = v; self.setState({ answers: a }); self.flash('Thanks, that helps us learn your patterns'); };

    var LEG = [{ k: 'legs', label: 'Legs', color: '#F2735F' }, { k: 'arms', label: 'Arms', color: '#FFD3CB' }, { k: 'torso', label: 'Torso', color: '#A3ABE6' }, { k: 'head', label: 'Head', color: '#2F3C9E' }];
    var legend = LEG.map(function (l) {
      var hid = !!s.hidden[l.k];
      return { label: l.label, color: l.color, pressed: hid ? 'false' : 'true', style: hid ? 'background:#F4F2F5;color:#8A8DA3;text-decoration:line-through' : 'background:#F4F2F5;color:#1F2347', toggle: function () { var h = Object.assign({}, s.hidden); h[l.k] = !hid; self.setState({ hidden: h }); } };
    });
    var chart = {
      legs: smooth(SERIES.legs), arms: smooth(SERIES.arms), torso: smooth(SERIES.torso), head: smooth(SERIES.head),
      legsOp: s.hidden.legs ? 0 : 0.6, armsOp: s.hidden.arms ? 0 : 0.7, torsoOp: s.hidden.torso ? 0 : 0.6, headOp: s.hidden.head ? 0 : 0.55
    };

    var allTriggers = [];
    Object.keys(s.triggers).forEach(function (k) { allTriggers = allTriggers.concat(s.triggers[k]); });
    var trigGroups = Object.keys(s.triggers).map(function (cat) {
      return {
        cat: cat, empty: s.triggers[cat].length === 0,
        items: s.triggers[cat].map(function (t) {
          return { label: t, aria: 'Remove ' + t, remove: function () { var tr = Object.assign({}, self.state.triggers); tr[cat] = tr[cat].filter(function (x) { return x !== t; }); self.setState({ triggers: tr }); self.flash(t + ' removed'); } };
        })
      };
    });
    var catChips = Object.keys(s.triggers).map(function (c) { var on = s.newCat === c; return { label: c, cls: on ? 'on' : '', pressed: on ? 'true' : 'false', pick: function () { self.setState({ newCat: c }); } }; });

    var rewards = REWARDS.map(function (r) {
      var red = s.redeemed.indexOf(r.id) >= 0, cant = s.points < r.cost;
      return {
        big: r.big, t: r.t, s: r.s, tile: r.tile, disabled: red || cant,
        cta: red ? 'Redeemed' : 'Redeem for ' + fmt(r.cost) + ' pts',
        btn: red ? 'background:#E8F5EE;color:#1F7A52' : 'background:#2F3C9E;color:#FFFFFF',
        ask: function () { self.setState({ confirm: r.id }); }
      };
    });
    var cr = REWARDS.filter(function (r) { return r.id === s.confirm; })[0];
    var history = s.history.map(function (h) { return { label: h.label, date: h.date, pts: (h.pts > 0 ? '+' : '−') + fmt(Math.abs(h.pts)), style: h.pts > 0 ? 'color:#2F3C9E' : 'color:#B23A27' }; });

    var streaks = [
      { n: 7, t: 'without flare-ups', s: '3 more days to the next level', pct: 70, medals: [3, 7, 0, 0, 0, 0] },
      { n: s.streak + (s.logDone ? 1 : 0), t: 'of Daily Log', s: (s.logDone ? '0' : '1') + ' more day to the next level', pct: s.logDone ? 100 : 90, medals: [5, s.logDone ? 10 : 0, 0, 0, 0, 0] }
    ].map(function (st) { return Object.assign({}, st, { medals: st.medals.map(function (v) { return { v: v || '?', got: !!v, cls: v ? 'got' : '' }; }) }); });
    var TR = ['cup', 0, 0, 0, 'crownC', 0, 0, 'cup', 'crownI', 0, 'cup', 0, 'crownC', 0, 'cup', 0, 0, 0];
    var trophies = TR.map(function (t) { return { isCup: t === 'cup', isCrown: t === 'crownC' || t === 'crownI', locked: !t, cls: t === 'cup' ? 'got' : (t === 'crownC' ? 'coral' : (t === 'crownI' ? 'indigo' : '')) }; });

    var L = s.log, Fl = s.flare;
    var MOODS = [{ k: 'good', label: 'Good' }, { k: 'ok', label: 'Okay' }, { k: 'bad', label: 'Not great' }];
    var moods = MOODS.map(function (m) { var on = L.mood === m.k; return { label: m.label, cls: on ? 'on' : '', pressed: on ? 'true' : 'false', isGood: m.k === 'good', isOk: m.k === 'ok', isBad: m.k === 'bad', pick: function () { self.setLog({ mood: m.k, emotions: [] }); } }; });
    var emotionChips = EMOTIONS[L.mood].map(function (e) { var on = L.emotions.indexOf(e) >= 0; return { label: e, cls: on ? 'on' : '', pressed: on ? 'true' : 'false', toggle: function () { self.setLog({ emotions: self.toggleIn(self.state.log.emotions, e) }); } }; });
    var SLEEP = [{ k: 'lt5', label: 'Under 5 h' }, { k: '5to7', label: '5–7 h' }, { k: 'gt7', label: '7+ h' }];

      if (done) self.addPoints(95, 'Panic Game');
    };

    var tabScreens = ['home', 'calendar', 'tips', 'insights'];
    var showTabs = tabScreens.indexOf(scr) >= 0;

    return {
      isHome: scr === 'home', isCalendar: scr === 'calendar', isTips: scr === 'tips', isInsights: scr === 'insights',
      isProfile: scr === 'profile', isTriggers: scr === 'triggers', isPoints: scr === 'points', isAchievements: scr === 'achievements',
      isLog: scr === 'log', isFlare: scr === 'flare', isPanic: scr === 'panic', showTabs: showTabs,
      nav: { home: scr === 'home' ? 'on' : '', calendar: scr === 'calendar' ? 'on' : '', tips: scr === 'tips' ? 'on' : '', insights: scr === 'insights' ? 'on' : '' },
      tabHome: function () { self.tab('home'); }, tabCalendar: function () { self.tab('calendar'); }, tabTips: function () { self.tab('tips'); }, tabInsights: function () { self.tab('insights'); },
      back: function () { self.back(); },
      goProfile: function () { self.go('profile'); }, goTriggers: function () { self.go('triggers'); }, goPoints: function () { self.go('points'); }, goAchievements: function () { self.go('achievements'); },
      goPanic: function () { self.setState({ panic: { set: 1, taps: 0, next: 'L', done: false } }); self.go('panic'); },
      startLog: function () { self.setLog({ step: 1 }); self.go('log'); },
      startFlare: function () { self.setState({ flare: { step: 1, view: 'front', parts: [], skin: [], treat: [] } }); self.go('flare'); },
      closeFlow: function () { self.back(); },
      hasToast: !!s.toast, toast: s.toast || '', toastBottom: showTabs ? 104 : 96,

      greeting: greeting, week: week, todoItems: todoItems, doneCount: doneCount,
      logDone: s.logDone, logOpen: !s.logDone, burst: s.burst, logCls: s.logDone ? 'done' : '',

      logTodo: function () { if (!self.state.logDone) { self.setLog({ step: 1 }); self.go('log'); } },
      toggleLike: function () { self.setState({ liked: !self.state.liked }); },
      likedPressed: s.liked ? 'true' : 'false', likeColor: s.liked ? '#B23A27' : '#6B6E85', likeFill: s.liked ? '#FF7B67' : 'none',

      cal: cal, calDayLabel: cal.short + ' ' + s.calSel,
      prevMonth: function () { self.setState({ calOffset: self.state.calOffset - 1, calSel: 1 }); },
      nextMonth: function () { self.setState({ calOffset: self.state.calOffset + 1, calSel: 1 }); },
      calTabs: { o: s.calTab === 'overview' ? 'on' : '', s: s.calTab === 'symptoms' ? 'on' : '', l: s.calTab === 'log' ? 'on' : '' },
      calIsOverview: s.calTab === 'overview', calIsSymptoms: s.calTab === 'symptoms', calIsLog: s.calTab === 'log',
      calOverview: function () { self.setState({ calTab: 'overview' }); }, calSymptoms: function () { self.setState({ calTab: 'symptoms' }); }, calLog: function () { self.setState({ calTab: 'log' }); },

      ptsTabs: { r: s.ptsTab === 'rewards' ? 'on' : '', h: s.ptsTab === 'history' ? 'on' : '' },
      ptsIsRewards: s.ptsTab === 'rewards', ptsIsHistory: s.ptsTab === 'history',
      ptsRewards: function () { self.setState({ ptsTab: 'rewards' }); }, ptsHistory: function () { self.setState({ ptsTab: 'history' }); },
      rewards: rewards, history: history, hasConfirm: !!cr,
      confirm: cr ? { t: cr.t, costFmt: fmt(cr.cost) } : { t: '', costFmt: '' },
      closeConfirm: function () { self.setState({ confirm: null }); },

        self.flash('Redeemed. Your code is on its way by email');
      },

      achTabs: { s: s.achTab === 'streaks' ? 'on' : '', t: s.achTab === 'trophies' ? 'on' : '' },
      achIsStreaks: s.achTab === 'streaks', achIsTrophies: s.achTab === 'trophies',
      achStreaks: function () { self.setState({ achTab: 'streaks' }); }, achTrophies: function () { self.setState({ achTab: 'trophies' }); },
      streaks: streaks, trophies: trophies,

      logCanBack: L.step > 1, logCta: L.step === 3 ? 'Save Daily Log' : 'Continue',

      logView: { f: L.view === 'front' ? 'on' : '', b: L.view === 'back' ? 'on' : '' },
      logFront: function () { self.setLog({ view: 'front' }); }, logBack: function () { self.setLog({ view: 'back' }); },
      logCount: countText(L.parts.length),
      logTreat: this.treatList(L.treat, function (id) { self.setLog({ treat: self.toggleIn(self.state.log.treat, id) }); }),
      logPrev: function () { self.setLog({ step: Math.max(1, self.state.log.step - 1) }); },
      logNext: function () {
        var st = self.state.log.step;
        if (st < 3) { self.setLog({ step: st + 1 }); return; }
        var wasDone = self.state.logDone;
        self.setState({ logDone: true, burst: true, screen: 'home', stack: [] });
        if (!wasDone) self.addPoints(50, 'Daily Log');
        self.flash(wasDone ? 'Daily Log updated' : 'Daily Log saved. +50 points');
        clearTimeout(self._b); self._b = setTimeout(function () { self.setState({ burst: false }); }, 900);
      },

      bodyMap: scr === 'log' ? this.body(L.view, L.parts, function (k) { self.setLog({ parts: self.toggleIn(self.state.log.parts, k) }); }) : this.body(Fl.view, Fl.parts, function (k) { self.setFlare({ parts: self.toggleIn(self.state.flare.parts, k) }); }),
      flareStep: Fl.step, flarePct: Fl.step * 50, flareS1: Fl.step === 1, flareS2: Fl.step === 2,
      flareCanBack: Fl.step > 1, flareCta: Fl.step === 2 ? 'Save flare-up' : 'Continue', flareBlocked: Fl.step === 1 && Fl.parts.length === 0,
      flareView: { f: Fl.view === 'front' ? 'on' : '', b: Fl.view === 'back' ? 'on' : '' },
      flareFront: function () { self.setFlare({ view: 'front' }); }, flareBack: function () { self.setFlare({ view: 'back' }); },
      flareCount: Fl.parts.length === 0 ? 'Tap the areas where you have a flare-up' : countText(Fl.parts.length),
      skinChips: skinChips,
      flareTreat: this.treatList(Fl.treat, function (id) { self.setFlare({ treat: self.toggleIn(self.state.flare.treat, id) }); }),
      flarePrev: function () { self.setFlare({ step: 1 }); },

        self.addPoints(80, 'Record Flare'); self.back(); self.flash('Flare-up saved. +80 points');
      },

      panic: P, panicPlaying: !P.done, panicDone: P.done, panicPct: Math.round(P.taps / 12 * 100),
      padL: P.next === 'L' ? 'next' : 'wait', padR: P.next === 'R' ? 'next' : 'wait',
      tapL: function () { tap('L'); }, tapR: function () { tap('R'); }
    };
  }
}
